<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Agenda Familia</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="apple-touch-icon" href="icono-512.png">
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root { --azul: #4f46e5; --fondo: #f3f4fb; --texto: #1f2937; --gris: #6b7280; --nav: 64px; }
    /* Sin alturas fijas en html/body (en iPhone dejaban una franja abajo): la barra va pegada al borde con position fixed */
    html, body { margin: 0; background: var(--fondo); color: var(--texto); font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 16px; }
    body { min-height: 100vh; padding-bottom: calc(var(--nav) + env(safe-area-inset-bottom) + 16px); }
    header { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; padding: calc(env(safe-area-inset-top) + 14px) 18px 18px; border-radius: 0 0 22px 22px; }
    header .fila { display: flex; align-items: center; gap: 10px; }
    header h1 { margin: 0; font-size: 22px; flex: 1; }
    header .fecha { opacity: .85; font-size: 14px; margin-top: 2px; }
    #estado { font-size: 13px; background: rgba(255,255,255,.18); padding: 4px 10px; border-radius: 20px; }
    main { padding: 14px; max-width: 640px; margin: 0 auto; }
    h2 { font-size: 15px; color: var(--gris); text-transform: uppercase; letter-spacing: .5px; margin: 20px 4px 8px; }
    h2:first-child { margin-top: 6px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
    .chip { flex: none; border: 2px solid transparent; background: #fff; border-radius: 20px; padding: 7px 13px; font-size: 15px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .chip.on { border-color: var(--c, var(--azul)); background: color-mix(in srgb, var(--c, var(--azul)) 14%, #fff); font-weight: 600; }
    .item { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 14px; padding: 12px; margin-bottom: 8px; border-left: 6px solid #94a3b8; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .item .ico { font-size: 24px; }
    .item .txt { flex: 1; min-width: 0; }
    .item .tit { font-weight: 600; }
    .item .sub { font-size: 13px; color: var(--gris); margin-top: 2px; }
    .item.hecho .tit { text-decoration: line-through; color: var(--gris); }
    .item.importante { background: #fff7ed; }
    .check { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 2px solid #cbd5e1; background: #fff; font-size: 18px; font-weight: 700; color: #fff; }
    .hecho .check { background: #22c55e; border-color: #22c55e; }
    .vacio { text-align: center; color: var(--gris); padding: 18px; background: #fff; border-radius: 14px; }
    .tarjeta { background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 10px; }
    /* Calendario */
    .mes-cab { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .mes-cab b { font-size: 18px; text-transform: capitalize; }
    .mes-cab button { border: none; background: #fff; width: 40px; height: 40px; border-radius: 12px; font-size: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .rejilla { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .rejilla .ds { text-align: center; font-size: 12px; color: var(--gris); padding: 4px 0; }
    .dia { background: #fff; border-radius: 10px; min-height: 52px; padding: 5px 3px; text-align: center; font-size: 15px; border: 2px solid transparent; }
    .dia.fuera { opacity: .35; }
    .dia.hoy { background: #eef2ff; font-weight: 700; color: var(--azul); }
    .dia.sel { border-color: var(--azul); }
    .puntos { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; margin-top: 4px; }
    .puntos i { width: 7px; height: 7px; border-radius: 50%; display: block; }
    /* Puntos de tareas */
    .marcador { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
    .marcador div { background: #fff; border-radius: 14px; padding: 12px; text-align: center; border-top: 5px solid var(--c); }
    .marcador b { display: block; font-size: 26px; }
    /* Barra inferior */
    nav { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; display: flex; justify-content: space-around; align-items: center; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -2px 10px rgba(0,0,0,.08); z-index: 10; }
    nav button { border: none; background: none; font-size: 12px; color: var(--gris); display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; min-width: 0; padding: 4px 0; font-size: 11px; }
    nav button span { font-size: 22px; }
    nav button.on { color: var(--azul); font-weight: 700; }
    nav .mas { flex: none; background: var(--azul); color: #fff; width: 54px; height: 54px; border-radius: 18px; font-size: 30px; min-width: 0; margin-top: -22px; box-shadow: 0 4px 12px rgba(79,70,229,.4); justify-content: center; }
    /* Ventanas */
    .fondo-modal { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
    .modal { background: #fff; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
    .modal h3 { margin: 0 0 12px; font-size: 19px; }
    label.et { display: block; font-size: 13px; color: var(--gris); margin: 12px 0 5px; font-weight: 600; }
    input, select, textarea { width: 100%; font-size: 16px; padding: 11px; border: 1.5px solid #d1d5db; border-radius: 12px; font-family: inherit; background: #fff; }
    textarea { min-height: 70px; }
    .con-micro { display: flex; gap: 8px; }
    .con-micro button { flex: none; width: 48px; border: none; border-radius: 12px; background: #eef2ff; font-size: 20px; }
    .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .botones { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
    .btn { flex: 1; border: none; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 600; background: #e5e7eb; color: var(--texto); }
    .btn.pri { background: var(--azul); color: #fff; }
    .btn.peligro { background: #fee2e2; color: #b91c1c; }
    .aviso { position: fixed; left: 50%; bottom: calc(var(--nav) + env(safe-area-inset-bottom) + 20px); transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 60; font-size: 15px; max-width: 90%; text-align: center; }
    .miembro { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
    .miembro:last-child { border-bottom: none; }
    .bola { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none; }
    .pie { text-align: center; color: var(--gris); font-size: 12px; margin: 20px 0; }
    small.ayuda { color: var(--gris); display: block; margin-top: 6px; line-height: 1.4; }
    #btn-ajustes, #btn-buscar, #btn-altavoz { background: rgba(255,255,255,.18); border: none; color: #fff; width: 38px; height: 38px; border-radius: 12px; font-size: 18px; }
    /* Exámenes */
    .barra { height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; margin-top: 8px; }
    .barra i { display: block; height: 100%; background: #22c55e; }
    .plan-dia { margin: 14px 0 5px; font-size: 13px; font-weight: 700; color: var(--gris); }
    .plan-dia.hoy { color: var(--azul); }
    .paso { display: flex; align-items: center; gap: 10px; padding: 9px 10px; background: #f8fafc; border-radius: 10px; margin-bottom: 5px; }
    .paso.hecho span { text-decoration: line-through; color: var(--gris); }
    .paso .check { width: 30px; height: 30px; font-size: 15px; }
    .fotos { display: flex; gap: 8px; flex-wrap: wrap; }
    .fotos a, .fotos label { width: 72px; height: 72px; border-radius: 10px; background: #eef2ff; display: flex; align-items: center; justify-content: center; font-size: 28px; text-decoration: none; overflow: hidden; }
    .fotos label { background: #fff; border: 2px dashed #c7d2fe; }
    /* Comidas */
    .menu-dia { display: grid; grid-template-columns: 50px 1fr 1fr; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; }
    .menu-dia:last-child { border-bottom: none; }
    .md-d { font-size: 13px; font-weight: 700; color: var(--gris); text-transform: capitalize; }
    .menu-dia.hoy .md-d { color: var(--azul); }
    .md-p { border: none; background: #f8fafc; border-radius: 10px; padding: 8px; font-size: 13px; text-align: left; min-height: 40px; overflow: hidden; color: var(--texto); }
    .voto { flex: none; border: 2px solid #d1d5db; background: #fff; border-radius: 14px; padding: 6px 10px; font-size: 18px; display: flex; flex-direction: column; align-items: center; min-width: 52px; }
    .voto.on { border-color: #22c55e; background: #dcfce7; }
    .voto b { font-size: 14px; }
    /* Fotos de cada uno */
    img.cara { border-radius: 50%; object-fit: cover; vertical-align: middle; }
    /* Cuenta atrás */
    .cuenta { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
    .cta { flex: none; width: 118px; background: #fff; border-radius: 16px; padding: 10px 8px; text-align: center; border-top: 5px solid var(--c); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .cta .em { font-size: 22px; }
    .cta b { display: block; font-size: 32px; color: var(--c); line-height: 1.1; }
    .cta .ud { font-size: 12px; color: var(--gris); }
    .cta .t { font-size: 13px; font-weight: 600; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cta .q { font-size: 12px; color: var(--gris); }
    details.tarjeta summary { cursor: pointer; font-size: 16px; }
    details.tarjeta p { line-height: 1.5; white-space: pre-wrap; }
    /* 🎤 Dictar (igual que en 360) */
    .dc-micro { display: block; margin: 12px auto 6px; width: 112px; height: 112px; border-radius: 50%; border: none; background: #f57c00; color: #fff; font-size: 54px; box-shadow: 0 6px 0 #b85c00; }
    .dc-micro:active { transform: translateY(5px); box-shadow: 0 1px 0 #b85c00; }
    .dc-micro.escuchando { background: #dc3545; animation: dc-latido 1.2s infinite; }
    @keyframes dc-latido { 50% { transform: scale(1.08); } }
    .dc-estado { text-align: center; font-size: 15px; font-weight: bold; color: #444; margin: 4px 0 10px; min-height: 20px; }
    .et-micro { display: flex; align-items: flex-end; justify-content: space-between; }
    .et-micro button { border: none; background: #fff3e0; color: #b85c00; border-radius: 10px; padding: 5px 10px; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    /* 👈👉 Deslizar: hecha / borrar (como en 360) */
    .item.deslizando { position: relative; z-index: 1; transition: none; }
    .item.volviendo { transition: transform 0.2s ease; }
    .item-fondo { position: absolute; z-index: 0; background: #dc3545; color: #fff; border-radius: 14px; display: flex; align-items: center; justify-content: flex-start;
        padding-left: 18px; box-sizing: border-box; font-weight: 900; font-size: 16px; pointer-events: none; }
    .item-fondo.listo { background: #b71c1c; }
    .item-fondo.hecho { background: #2e7d32; justify-content: flex-end; padding-left: 0; padding-right: 18px; }
    .item-fondo.hecho.listo { background: #1b5e20; }
    .item .hecha-por { color: #2e7d32; font-weight: 700; }
    .btn-deshacer { flex: none; border: none; background: #ffc107; color: #000; border-radius: 8px; padding: 6px 12px; font-weight: 900; font-size: 14px; margin-left: 6px; }
    /* 📢 Altavoz */
    .anuncio { display: flex; gap: 12px; align-items: flex-start; background: #f5f3ff; border-left: 6px solid #7c3aed; border-radius: 14px; padding: 12px; margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .anuncio.rec { background: #fff7ed; border-left-color: #f57c00; }
    .anuncio .ico { font-size: 24px; }
    .anuncio .tx { flex: 1; min-width: 0; white-space: pre-wrap; line-height: 1.4; }
    .anuncio .sub { font-size: 13px; color: var(--gris); margin-top: 4px; }
    .grande-aviso { font-size: 19px; line-height: 1.45; white-space: pre-wrap; margin: 6px 0 4px; }
</style>
</head>
<body>
<header>
    <div class="fila"><h1 id="titulo">Agenda Familia</h1><span id="estado" onclick="sincronizar(true)"></span><button id="btn-altavoz" onclick="abrirAltavoz()" title="Altavoz: anuncios y recordatorios" style="display:none">📢</button><button id="btn-buscar" onclick="abrirBuscar()">🔎</button><button id="btn-ajustes" onclick="ir('ajustes')">⚙️</button></div>
    <div class="fecha" id="cab-fecha"></div>
</header>
<main id="vista"></main>
<nav>
    <button data-v="hoy" onclick="ir('hoy')"><span>🏠</span>Hoy</button>
    <button data-v="cal" onclick="ir('cal')"><span>📅</span>Calendario</button>
    <button class="mas" onclick="nuevoSegunVista()">＋</button>
    <button data-v="examenes" onclick="ir('examenes')"><span>📝</span>Exámenes</button>
    <button data-v="tareas" onclick="ir('tareas')"><span>⭐</span>Tareas</button>
    <button data-v="comidas" onclick="ir('comidas')"><span>🍽️</span>Comidas</button>
</nav>
<div id="capa-modal"></div>

<script>
// ==========================================
// AGENDA FAMILIA · v1 (25/11/2026) · v3 (26/11): PDF grandes del temario reducidos en el móvil
// v4 (27/11): 📢 altavoz, 🎤 dictado de 360, deslizar ✓ hecha / 🗑️ borrar con Deshacer y papelera
// Hecha a partir de las ideas de MOVILEC 360 (calendario, marcar hecho, dictar, aviso de versión),
// pero separada del todo: su propia web y su propia hoja de Google (cuenta personal).
// Los datos se guardan en el móvil y, si hay conexión configurada, se comparten con la hoja (Codigo.gs).
// ==========================================
const VERSION_APP = 4;
const TIPOS = {
    deberes: ['📚', 'Deberes'], examen: ['📝', 'Examen'], actividad: ['⚽', 'Actividad'],
    medico: ['🩺', 'Médico'], cumple: ['🎂', 'Cumpleaños'], viaje: ['✈️', 'Viaje'], otro: ['📌', 'Otro']
};
const IMPORTANTES = ['examen', 'cumple', 'medico', 'viaje'];
const COLORES = ['#3b82f6', '#ec4899', '#f59e0b', '#10b981', '#8b5cf6', '#ef4444', '#06b6d4', '#84cc16'];
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

// ---------- Guardado en el móvil ----------
function leerLS(k, def) { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch (e) { return def; } }
function guardarLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
let cfg = leerLS('af_config', { url: '', clave: '', yo: '' });
let D = leerLS('af_datos', null);
let pend = leerLS('af_pendientes', []);
if (!D) {
    // Primera vez: una familia de ejemplo, que se cambia en Ajustes
    const t = Date.now();
    D = { miembros: [
        { id: 'ej1', nombre: 'Papá', emoji: '👨', color: '#3b82f6', rol: 'padre', mod: t },
        { id: 'ej2', nombre: 'Hijo 1', emoji: '🧒', color: '#f59e0b', rol: 'hijo', mod: t },
        { id: 'ej3', nombre: 'Hijo 2', emoji: '👧', color: '#10b981', rol: 'hijo', mod: t }
    ], eventos: [], tareas: [], examenes: [] };
    guardarLS('af_datos', D);
}
D.examenes = D.examenes || []; D.comidas = D.comidas || []; D.compra = D.compra || []; D.anuncios = D.anuncios || []; D.papelera = D.papelera || [];
const TABLAS_APP = ['miembros', 'eventos', 'tareas', 'examenes', 'comidas', 'compra', 'anuncios', 'papelera'];
// Pestañas que llegaron con la v4: si el script de la hoja aún es el viejo, lo suyo se queda esperando en el móvil
const TABLAS_V4 = ['anuncios', 'papelera'];

// ---------- Fechas ----------
const dos = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + dos(d.getMonth() + 1) + '-' + dos(d.getDate());
const deIso = s => { const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d); };
const hoyIso = () => iso(new Date());
const sumarDias = (s, n) => { const d = deIso(s); d.setDate(d.getDate() + n); return iso(d); };
const nombreDia = s => { const d = deIso(s); return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; };
const lunesDe = s => { const d = deIso(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const nuevoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- Datos ----------
const miembro = id => D.miembros.find(m => m.id === id);
const miembrosDe = quien => String(quien || '').split(',').filter(Boolean).map(miembro).filter(Boolean);
const lista = s => String(s || '').split(',').filter(Boolean);
// «hecho» guarda las fechas en que se hizo y, desde la v4, quién: «2026-11-27=id» (las de antes, solo la fecha)
const fechasHecho = x => lista(x.hecho).map(h => h.slice(0, 10));
const estaHecho = (x, fecha) => x.repetir && x.repetir !== 'una' && x.repetir !== '' ? fechasHecho(x).includes(fecha) : lista(x.hecho).length > 0;
function quienHizo(x, fecha) {
    const rep = x.repetir && x.repetir !== 'una';
    const h = lista(x.hecho).find(v => !rep || v.slice(0, 10) === fecha);
    return h && h.length > 11 ? miembro(h.slice(11)) : null;
}

// Eventos de un día (con los que se repiten cada semana o cada año)
function eventosDe(fecha) {
    const d = deIso(fecha);
    const examenes = D.examenes.filter(x => x.fecha === fecha).map(x => ({ id: x.id, fecha, hora: x.hora || '', titulo: 'Examen de ' + x.asignatura, tipo: 'examen', quien: x.quien, repetir: '', esExamen: true }));
    return D.eventos.concat(examenes).filter(e => {
        if (e.fecha === fecha) return true;
        if (fecha < e.fecha) return false;
        if (e.repetir === 'semanal') return deIso(e.fecha).getDay() === d.getDay();
        if (e.repetir === 'anual') return e.fecha.slice(5) === fecha.slice(5);
        return false;
    }).filter(pasaFiltro).sort((a, b) => (a.hora || '00:00').localeCompare(b.hora || '00:00'));
}
// Tareas de casa de un día. Las de «una vez» sin hacer se arrastran a hoy.
function tareasDe(fecha) {
    const hoy = hoyIso(), d = deIso(fecha);
    return D.tareas.filter(t => {
        if (fecha < t.fecha && t.repetir !== 'una') return false;
        if (t.repetir === 'diaria') return true;
        if (t.repetir === 'semanal') return deIso(t.fecha).getDay() === d.getDay();
        const hechaEl = fechasHecho(t)[0];
        if (hechaEl) return hechaEl === fecha;
        return t.fecha === fecha || (fecha === hoy && t.fecha < hoy);
    }).filter(pasaFiltro);
}
function puntosSemana(idMiembro) {
    const ini = lunesDe(hoyIso()), fin = sumarDias(ini, 6);
    return D.tareas.filter(t => t.quien === idMiembro)
        .reduce((s, t) => s + fechasHecho(t).filter(f => f >= ini && f <= fin).length * (Number(t.puntos) || 0), 0);
}
let filtro = '';
const pasaFiltro = x => !filtro || !x.quien || lista(x.quien).includes(filtro);

// Cada cambio: se guarda en el móvil y se apunta para subirlo a la hoja
function guardar(tabla, fila) {
    fila.mod = Date.now();
    const i = D[tabla].findIndex(x => x.id === fila.id);
    if (i >= 0) D[tabla][i] = fila; else D[tabla].push(fila);
    pend.push({ op: 'guardar', tabla, fila });
    guardarLS('af_datos', D); guardarLS('af_pendientes', pend);
    sincronizar();
}
function borrar(tabla, id) {
    // Las notas, tareas y exámenes borrados van a la papelera (se pueden recuperar 30 días). Devuelve su id, para Deshacer
    const fila = D[tabla].find(x => x.id === id);
    let pid = '';
    if (fila && PAPELERA_DE.includes(tabla)) {
        pid = nuevoId();
        guardar('papelera', { id: pid, tabla, ref: id, titulo: tituloDe(tabla, fila), fila: JSON.stringify(fila), quien: cfg.yo || '', f: new Date().toISOString() });
    }
    D[tabla] = D[tabla].filter(x => x.id !== id);
    pend.push({ op: 'borrar', tabla, id });

// ---------- Conexión con la hoja de Google ----------
let sincronizando = false, otraVez = false;
async function sincronizar(manual) {
    if (!cfg.url) { estado(manual ? '📱 Solo en este móvil' : ''); if (manual) ir('ajustes'); return; }
    if (sincronizando) { otraVez = true; return; }
    sincronizando = true; estado('⏳');
    const enviando = pend.slice();
    try {
        const r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ clave: cfg.clave, ops: enviando }) });
        const j = await r.json();
        if (!j.ok) throw new Error(j.error || 'error');
        const viejo = !Array.isArray(j.anuncios);
        pend = (viejo ? enviando.filter(o => TABLAS_V4.includes(o.tabla)) : []).concat(pend.slice(enviando.length)); guardarLS('af_pendientes', pend);
        // Lo que aún no se ha subido se vuelve a aplicar encima de lo que llega
        TABLAS_APP.forEach(t => { if (!(viejo && TABLAS_V4.includes(t))) D[t] = j[t] || []; });
        pend.forEach(o => {
            const i = D[o.tabla].findIndex(x => x.id === (o.fila ? o.fila.id : o.id));
            if (o.op === 'borrar') { if (i >= 0) D[o.tabla].splice(i, 1); }
            else if (o.op === 'votar') { if (i >= 0) { const v = lista(D[o.tabla][i].votos).filter(x => x !== o.quien); if (o.si) v.push(o.quien); D[o.tabla][i].votos = v.join(','); } }
            else if (i >= 0) D[o.tabla][i] = o.fila; else D[o.tabla].push(o.fila);
        });
        guardarLS('af_datos', D);
        estado('✓ Al día'); setTimeout(() => estado(''), 2500);
        if (!document.querySelector('.fondo-modal')) { pintar(); mirarAnuncios(); }
    } catch (e) {
        estado(navigator.onLine ? '⚠️ Sin conectar' : '📴 Sin conexión');
        if (manual) avisar(String(e.message).includes('CLAVE') ? '🔑 La clave no es la de la hoja' : '⚠️ No se pudo conectar: ' + e.message);
    } finally {
        sincronizando = false;
        if (otraVez) { otraVez = false; sincronizar(); }
    }
}

const esAndroid = () => /Android/i.test(navigator.userAgent);
const esIOS = () => /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function abrirAviso(a) {

    capa.innerHTML = `<div class="modal"><h3>⏰ Avisarme</h3><div style="font-weight:600">${esc(a.titulo)}</div>
        <div class="dos"><div><label class="et">Día</label><input type="date" id="al-fecha" value="${a.fecha}"></div><div><label class="et">Hora</label><input type="time" id="al-hora" value="${a.hora || '09:00'}"></div></div>
        <label class="et">Que suene</label><select id="al-antes">${[[0, 'A esa hora justa'], [10, '10 minutos antes'], [30, '30 minutos antes'], [60, '1 hora antes'], [1440, '1 día antes']]
            .map(([v, t]) => `<option value="${v}" ${(a.antes || 0) === v ? 'selected' : ''}>${t}</option>`).join('')}</select>

        <div class="botones">${esIOS() ? '' : `<button class="btn" onclick="alarmaReloj()">⏰ Alarma en el Reloj</button>`}<button class="btn pri" onclick="alarmaCalendario()">📅 Al calendario del móvil</button></div>
        <small class="ayuda" id="al-estado">${a.hora ? '' : 'Elige a qué hora quieres el aviso.'}</small>

function alarmaDatos() {
    const f = document.getElementById('al-fecha').value, h = document.getElementById('al-hora').value, est = document.getElementById('al-estado');
    if (!f || !h) { est.textContent = 'Pon el día y la hora.'; return null; }
    const inicio = new Date(f + 'T' + h), antes = +document.getElementById('al-antes').value, diario = !!document.getElementById('al-diario')?.checked;
    return { titulo: avisoActual.titulo, notas: avisoActual.notas || '', inicio, antes, suena: new Date(inicio.getTime() - antes * 60000), est,
        hasta: diario ? avisoActual.hasta : '', diario };
}
function alarmaReloj() {
    const a = alarmaDatos(); if (!a) return;
    const falta = a.suena - Date.now();
    if (falta < 0) { a.est.textContent = '⚠️ Esa hora ya ha pasado.'; return; }
    if (falta > 24 * 3600000 && !a.diario) { a.est.textContent = '⚠️ El Reloj solo pone alarmas para las próximas 24 horas (no sabe de días). Para más adelante usa «Al calendario del móvil».'; return; }
    const msj = encodeURIComponent(('⏰ ' + a.titulo).slice(0, 60));
    location.href = `intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${a.suena.getHours()};` +
        `i.android.intent.extra.alarm.MINUTES=${a.suena.getMinutes()};S.android.intent.extra.alarm.MESSAGE=${msj};B.android.intent.extra.alarm.SKIP_UI=false;end`;
    // Si el móvil no deja abrir el Reloj, la app sigue delante: se avisa
    let fuera = false; const marca = () => { fuera = true; };
    document.addEventListener('visibilitychange', marca, { once: true }); window.addEventListener('blur', marca, { once: true });
    a.est.textContent = '⏳ Abriendo el Reloj...';
    setTimeout(() => { a.est.textContent = fuera ? (a.diario ? '✅ En el Reloj, marca todos los días de la semana para que se repita' + (a.hasta ? ', y bórrala cuando acabe.' : '.') : '✅ Comprueba en el Reloj que la alarma ha quedado puesta.') :
        '❌ Este móvil no deja abrir el Reloj desde la app. Usa «Al calendario del móvil».'; }, 2500);
}
function alarmaCalendario() {
    const a = alarmaDatos(); if (!a) return;
    const sello = d => d.getFullYear() + dos(d.getMonth() + 1) + dos(d.getDate()) + 'T' + dos(d.getHours()) + dos(d.getMinutes()) + '00';
    const fin = new Date(a.inicio.getTime() + 30 * 60000), regla = a.diario ? 'RRULE:FREQ=DAILY' + (a.hasta ? ';UNTIL=' + a.hasta.replace(/-/g, '') + 'T235959' : '') : '';
    if (esAndroid()) {
        // Google Calendar no deja fijar el aviso por enlace: sale el que tenga cada uno por defecto y se cambia antes de guardar
        const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(a.titulo) +
            '&dates=' + sello(a.inicio) + '/' + sello(fin) + '&ctz=Europe/Madrid' + (a.notas ? '&details=' + encodeURIComponent(a.notas) : '') +
            (regla ? '&recur=' + encodeURIComponent(regla) : '');
        window.open(url, '_blank');
        a.est.textContent = '📅 En Google Calendar, antes de Guardar, mira la línea de la campanita 🔔 (notificación) y pon «' +
            document.getElementById('al-antes').selectedOptions[0].text.toLowerCase() + '».';
        return;
    }
    const txt = s => String(s).replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\r?\n/g, '\\n');
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Agenda Familia//ES', 'BEGIN:VEVENT',
        'UID:' + Date.now() + '@agenda-familia', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, ''),
        'DTSTART:' + sello(a.inicio), 'DTEND:' + sello(fin), 'SUMMARY:' + txt(a.titulo)]
        .concat(regla ? [regla] : []).concat(a.notas ? ['DESCRIPTION:' + txt(a.notas)] : [])
        .concat(['BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + txt(a.titulo), 'TRIGGER:-PT' + a.antes + 'M', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR']).join('\r\n');
    const enlace = document.createElement('a');
    enlace.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
    enlace.download = 'aviso.ics'; document.body.appendChild(enlace); enlace.click(); enlace.remove();
    a.est.textContent = '📅 Abre el archivo «aviso.ics» y pulsa «Añadir» al calendario. El aviso ya va puesto.';
}

// El plan: reparte los temas entre los días que quedan. Cuantos más días, más pasos por tema
// (leer, esquema, ejercicios y repaso espaciado). Los dos últimos días: simulacro y repaso final.
function hacerPlan(temasTxt, desde, examen, findes) {
    const temas = String(temasTxt || '').split('\n').map(s => s.trim()).filter(Boolean);
    const dias = [];
    for (let f = desde; f < examen; f = sumarDias(f, 1)) { const d = deIso(f).getDay(); if (!findes || (d !== 0 && d !== 6)) dias.push(f); }
    if (!dias.length || !temas.length) return [];
    const finales = [];
    if (dias.length >= 4) finales.push('🧪 Simulacro: hazte un examen de prueba de todos los temas y repasa los fallos');
    if (dias.length >= 2) finales.push('🌙 Repaso final: lee tus esquemas, prepara la mochila y duerme bien');
    const R = dias.length - finales.length, n = temas.length, tareas = [];
    if (R >= n * 4) {
        temas.forEach((t, k) => {
            tareas.push('📖 Leer y subrayar: ' + t, '✏️ Esquema o resumen: ' + t, '❓ Ejercicios y preguntas: ' + t);
            if (k) tareas.push('🔁 Repasar sin mirar (explícalo en voz alta): ' + temas[k - 1]);
        });
        tareas.push('🔁 Repasar sin mirar (explícalo en voz alta): ' + temas[n - 1]);
    } else if (R >= n * 3) temas.forEach(t => tareas.push('📖 Leer y subrayar: ' + t, '✏️ Esquema o resumen: ' + t, '❓ Ejercicios y preguntas: ' + t));
    else if (R >= n * 2) temas.forEach(t => tareas.push('📖 Leer, subrayar y esquema: ' + t, '❓ Ejercicios y repaso: ' + t));
    else temas.forEach(t => tareas.push('📖 Estudiar (leer, esquema y ejercicios): ' + t));
    const plan = tareas.map((t, i) => ({ f: dias[Math.floor(i * R / tareas.length)], t }));
    finales.forEach((t, i) => plan.push({ f: dias[R + i], t }));
    return plan;
}

            .map(p => ({ f: p.fecha, t: p.tarea })).sort((a, b) => a.f.localeCompare(b.f));
        if (!plan.length) throw new Error('la IA no devolvió un plan válido');
        x = camposExamen(D.examenes.find(y => y.id === id));
        guardar('examenes', Object.assign(x, { temas: (j.temas || []).map(t => t.titulo).join('\n') || x.temas,

        avisar('✨ Plan hecho: ' + plan.length + ' pasos y ' + (j.temas || []).length + ' resúmenes');

}

// Fotos del temario: se reducen en el móvil (más rápido) y se guardan en el Drive de la cuenta de la hoja
async function subirTemario(id, archivos) {
    if (!cfg.url) { avisar('⚠️ Conecta la hoja en ⚙️ Ajustes para guardar el temario'); return; }
    const info = document.getElementById('ex-subida'), fotos = fotosDe(D.examenes.find(y => y.id === id)), lista_ = [...archivos];
    const asignatura = D.examenes.find(y => y.id === id).asignatura;
    for (let n = 0; n < lista_.length; n++) {
        const f = lista_[n], imagen = f.type.startsWith('image');
        if (info) info.textContent = `⏳ Subiendo ${n + 1} de ${lista_.length}…`;
        try {
            const datos = imagen ? await reducirImagen(f) : await prepararPdf(f, info), tipo = imagen ? 'image/jpeg' : 'application/pdf';
            if (datos === null) continue;
            if (info) info.textContent = `⏳ Subiendo ${n + 1} de ${lista_.length}…`;
            const r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ clave: cfg.clave, subir: { nombre: asignatura + ' - ' + (f.name || 'foto'), tipo, datos } }) });
            const j = await r.json();
            if (!j.ok) throw new Error(j.error);
            fotos.push({ id: j.id, t: tipo });
        } catch (e) { avisar('⚠️ No se pudo subir: ' + e.message); break; }
    }
    guardar('examenes', Object.assign(camposExamen(D.examenes.find(y => y.id === id)), { fotos: JSON.stringify(fotos) }));
    pintarExamen(id);
}
function reducirImagen(f) {
    return new Promise((ok, mal) => {
        const img = new Image();
        img.onload = () => {
            const k = Math.min(1, 1800 / Math.max(img.width, img.height)), c = document.createElement('canvas');
            c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            URL.revokeObjectURL(img.src);
            ok(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
        };
        img.onerror = () => mal(new Error('la imagen no se puede leer'));
        img.src = URL.createObjectURL(f);
    });
}
// v3 (26/11): PDF del temario. Los escaneados pesan mucho (cada página es una foto enorme) y la IA lee un número
// limitado de páginas. Si el PDF pasa de 8 MB o de PDF_MAX_PAG páginas, se rehace en el móvil: se eligen las páginas
// (si son muchas) y cada una se pasa a JPEG más pequeño con pdf.js, y se vuelve a juntar en un PDF con jsPDF.
const PDF_MAX_PAG = 60;
function cargarScript(src) {
    return new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => mal(new Error('sin conexión para preparar el PDF')); document.head.appendChild(s); });
}
async function libreriasPdf() {
    if (!window.pdfjsLib) await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    if (!window.jspdf) await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
}
// «12-40, 45» → [12, 13, …, 40, 45] (solo las que existen)
function paginasElegidas(txt, total) {
    const s = new Set();
    String(txt).split(/[,;\s]+/).forEach(p => {
        const m = p.match(/^(\d+)(?:-(\d+))?$/);
        if (!m) return;
        let a = +m[1], b = +(m[2] || m[1]);
        if (a > b) [a, b] = [b, a];
        for (let i = Math.max(1, a); i <= Math.min(total, b); i++) s.add(i);
    });
    return [...s].sort((a, b) => a - b);
}
// Devuelve el PDF en base64 listo para subir, o null si se cancela al elegir las páginas
async function prepararPdf(f, info) {
    if (info) info.textContent = '⏳ Mirando el PDF…';
    try { await libreriasPdf(); }
    catch (e) { if (f.size <= 20e6) return aBase64(f); throw e; }
    const doc = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
    if (doc.numPages <= PDF_MAX_PAG && f.size <= 8e6) { doc.destroy(); return aBase64(f); }
    let pags = Array.from({ length: doc.numPages }, (_, i) => i + 1);
    if (doc.numPages > PDF_MAX_PAG) {
        const r = prompt(`El PDF tiene ${doc.numPages} páginas y la IA lee ${PDF_MAX_PAG} como mucho.\n¿Qué páginas entran en el examen? (ej.: 12-40 o 5-20, 31-35)`, '1-' + PDF_MAX_PAG);
        if (r === null) { doc.destroy(); return null; }
        pags = paginasElegidas(r, doc.numPages);
        if (!pags.length) { doc.destroy(); throw new Error('no entiendo las páginas «' + r + '»'); }
        if (pags.length > PDF_MAX_PAG) { avisar(`📄 Solo se suben las ${PDF_MAX_PAG} primeras páginas que has puesto`); pags = pags.slice(0, PDF_MAX_PAG); }
    }
    let pdf = null;
    for (let n = 0; n < pags.length; n++) {
        if (info) info.textContent = `⏳ Reduciendo el PDF: página ${n + 1} de ${pags.length}…`;
        const p = await doc.getPage(pags[n]), v1 = p.getViewport({ scale: 1 });
        const v = p.getViewport({ scale: 1700 / Math.max(v1.width, v1.height) });
        const c = document.createElement('canvas');
        c.width = Math.round(v.width); c.height = Math.round(v.height);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        await p.render({ canvasContext: ctx, viewport: v }).promise;
        const o = c.width > c.height ? 'l' : 'p';
        if (!pdf) pdf = new jspdf.jsPDF({ unit: 'pt', format: [c.width, c.height], orientation: o, compress: true });
        else pdf.addPage([c.width, c.height], o);
        pdf.addImage(c.toDataURL('image/jpeg', 0.6), 'JPEG', 0, 0, c.width, c.height);
        p.cleanup(); c.width = c.height = 0;
    }
    doc.destroy();
    const datos = pdf.output('datauristring').split(',')[1];
    if (datos.length > 27e6) throw new Error('el PDF sigue siendo muy grande: elige menos páginas');
    return datos;
}
function aBase64(f) { return new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = () => mal(new Error('no se pudo leer')); r.readAsDataURL(f); }); }

let fotoMiembro, recorte = null;
function elegirFotoMiembro(f) {
    if (!f) return;
    const img = new Image();
    img.onload = () => {
        const s0 = 200 / Math.min(img.width, img.height);
        recorte = { img, s0, zoom: 1, x: (200 - img.width * s0) / 2, y: (200 - img.height * s0) / 2 };
        document.getElementById('mi-recorte').style.display = '';
        document.getElementById('rc-img').src = img.src;
        document.getElementById('rc-zoom').value = 1;

    img.onerror = () => avisar('⚠️ No se puede leer esa foto');

}
function zoomRecorte(z) {
    const r = recorte, sv = r.s0 * r.zoom, cx = (100 - r.x) / sv, cy = (100 - r.y) / sv;
    r.zoom = z; const sn = r.s0 * z; r.x = 100 - cx * sn; r.y = 100 - cy * sn;
    pintarRecorte();
}
function pintarRecorte() {
    const r = recorte, s = r.s0 * r.zoom, w = r.img.width * s, h = r.img.height * s;
    r.x = Math.min(0, Math.max(200 - w, r.x)); r.y = Math.min(0, Math.max(200 - h, r.y));
    const im = document.getElementById('rc-img');

    im.style.width = w + 'px'; im.style.height = h + 'px'; im.style.left = r.x + 'px'; im.style.top = r.y + 'px';
}
function moverRecorte(ev) {
    const marco = document.getElementById('rc-marco');
    marco.setPointerCapture(ev.pointerId);
    let px = ev.clientX, py = ev.clientY;
    marco.onpointermove = e => { recorte.x += e.clientX - px; recorte.y += e.clientY - py; px = e.clientX; py = e.clientY; pintarRecorte(); };
    marco.onpointerup = marco.onpointercancel = () => { marco.onpointermove = null; };
}
function fotoRecortada() {
    const r = recorte, s = r.s0 * r.zoom, c = document.createElement('canvas');
    c.width = c.height = 160;
    c.getContext('2d').drawImage(r.img, -r.x / s, -r.y / s, 200 / s, 200 / s, 0, 0, 160, 160);
    return c.toDataURL('image/jpeg', 0.8);
}

// ---------- 👈👉 HECHA Y BORRADA (como en 360) ----------
// Deslizar una nota o tarea a la izquierda: ✓ hecha (o vuelve a pendiente), y queda quién la hizo. A la derecha: se
// borra sin preguntar (si se repite, sí pregunta) y sale ↩️ Deshacer. Lo borrado va a la papelera, compartida con
// la familia, y se puede recuperar durante 30 días desde «🗑️ Borrado hace poco».
const PAPELERA_DE = ['eventos', 'tareas', 'examenes'];
const PAPELERA_DIAS = 30;
const tituloDe = (tabla, f) => tabla === 'examenes' ? 'Examen de ' + f.asignatura : f.titulo;

// Un hijo/a solo borra deslizando lo que es solo suyo y no sea una tarea de casa (las tareas las ponen los padres)
function puedeBorrarDeslizando(tabla, x) {
    if (esAdulto() || !cfg.yo) return true;
    return tabla === 'eventos' && x.quien === cfg.yo;
}
let deslizar = null, deslizarAnularClic = false;
const deslizarAbajo = e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const el = e.target.closest && e.target.closest('.item[data-tabla]');
    if (!el || e.target.closest('.check')) return;
    const x = (D[el.dataset.tabla] || []).find(y => y.id === el.dataset.id);
    if (!x) return;
    deslizar = { el, x, tabla: el.dataset.tabla, fecha: el.dataset.fecha, x0: e.clientX, y0: e.clientY, dx: 0, modo: null, id: e.pointerId, puedeBorrar: puedeBorrarDeslizando(el.dataset.tabla, x) };
};
const deslizarMover = e => {
    const d = deslizar;
    if (!d || e.pointerId !== d.id) return;
    const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
    if (!d.modo) {
        if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
        if (Math.abs(dy) > Math.abs(dx) || (dx > 0 && !d.puedeBorrar)) { deslizar = null; return; }   // es mover la lista, o no puede
        d.modo = dx < 0 ? 'hecho' : 'borrar';
        const el = d.el;
        if (getComputedStyle(el.parentNode).position === 'static') el.parentNode.style.position = 'relative';
        d.fondo = document.createElement('div'); d.fondo.className = 'item-fondo' + (d.modo === 'hecho' ? ' hecho' : '');
        d.fondo.textContent = d.modo === 'borrar' ? '🗑️ Borrar' : estaHecho(d.x, d.fecha) ? '↩️ Pendiente' : '✓ Hecha';
        Object.assign(d.fondo.style, { left: el.offsetLeft + 'px', top: el.offsetTop + 'px', width: el.offsetWidth + 'px', height: el.offsetHeight + 'px' });
        el.parentNode.insertBefore(d.fondo, el);
        el.classList.add('deslizando');
        try { el.setPointerCapture(e.pointerId); } catch (x) {}
    }
    d.dx = d.modo === 'hecho' ? Math.min(0, dx) : Math.max(0, dx);
    d.el.style.transform = `translateX(${d.dx}px)`;
    d.fondo.classList.toggle('listo', Math.abs(d.dx) > d.el.offsetWidth * (d.modo === 'hecho' ? 0.3 : 0.5));
};
function deslizarSoltar(e) {
    const d = deslizar;
    if (!d || e.pointerId !== d.id) return;
    deslizar = null;
    if (!d.modo) return;
    deslizarAnularClic = true; setTimeout(() => { deslizarAnularClic = false; }, 400);   // que no se abra la nota al soltar
    const ancho = d.el.offsetWidth, quitar = () => { if (d.fondo) d.fondo.remove(); d.el.classList.remove('deslizando', 'volviendo'); d.el.style.transform = ''; };
    const volver = () => { d.el.classList.add('volviendo'); d.el.style.transform = ''; setTimeout(quitar, 220); };
    if (d.modo === 'hecho') {   // vuelve a su sitio y cambia
        volver();
        if (e.type !== 'pointercancel' && -d.dx > ancho * 0.3) setTimeout(() => marcar(d.tabla, d.x.id, d.fecha), 230);
        return;
    }
    if (e.type === 'pointercancel' || d.dx <= ancho * 0.5) { volver(); return; }
    if (repiteX(d.x) && !confirm(`«${tituloDe(d.tabla, d.x)}» se repite: se borran todas las veces. ¿Borrar?`)) { volver(); return; }
    d.el.classList.add('volviendo'); d.el.style.transform = `translateX(${ancho + 20}px)`;
    setTimeout(() => {
        d.el.style.display = 'none'; if (d.fondo) d.fondo.remove();
        const pid = borrar(d.tabla, d.x.id);
        pintar(); avisarDeshacer('🗑️ Borrado: ' + tituloDe(d.tabla, d.x), pid);
    }, 200);
}
// En iPhone el gesto con «pointer» no llega a borrar: allí se hace con los eventos de toque, y en cuanto se ve que es
// deslizar de lado se frena el desplazamiento de la lista
const deslizarIOS = esIOS();
const deslizarToque = (e, t, tipo) => ({ clientX: t.clientX, clientY: t.clientY, pointerId: 'toque', pointerType: 'touch', button: 0, target: e.target, type: tipo });
document.addEventListener('pointerdown', e => { if (!(deslizarIOS && e.pointerType === 'touch')) deslizarAbajo(e); });
document.addEventListener('pointermove', e => { if (!(deslizarIOS && e.pointerType === 'touch')) deslizarMover(e); });
document.addEventListener('pointerup', e => { if (!(deslizarIOS && e.pointerType === 'touch')) deslizarSoltar(e); });
document.addEventListener('pointercancel', e => { if (!(deslizarIOS && e.pointerType === 'touch')) deslizarSoltar(e); });
if (deslizarIOS) {
    document.addEventListener('touchstart', e => { if (e.touches.length === 1) deslizarAbajo(deslizarToque(e, e.touches[0], 'pointerdown')); else deslizar = null; }, { passive: true });
    document.addEventListener('touchmove', e => {
        if (!deslizar || deslizar.id !== 'toque') return;
        deslizarMover(deslizarToque(e, e.touches[0], 'pointermove'));
        if (deslizar && deslizar.modo && e.cancelable) e.preventDefault();   // ya es borrar/hecha: que no se mueva la lista
    }, { passive: false });
    document.addEventListener('touchend', e => { const t = e.changedTouches[0]; if (t) deslizarSoltar(deslizarToque(e, t, 'pointerup')); });
    document.addEventListener('touchcancel', e => { const t = e.changedTouches[0]; if (t) deslizarSoltar(deslizarToque(e, t, 'pointercancel')); });
}
document.addEventListener('click', e => { if (deslizarAnularClic) { e.stopPropagation(); e.preventDefault(); deslizarAnularClic = false; } }, true);

// Los móviles de los adultos vacían lo que lleva más de 30 días en la papelera

// ---------- 🎤 DICTAR: el mismo micrófono que el «Dictar al calendario» de 360 ----------
// Ventana con el micrófono grande. Escucha seguido (continuous) y, si el móvil corta al pararse a pensar, vuelve a
// abrirse solo; deja de escuchar tras 8 s callado (12 s si aún no se ha dicho nada). «Seguir» pasa el texto a la casilla.
// En iPhone el dictado de la web falla en la app instalada: se usa el 🎤 del teclado.
const DICTADO_SILENCIO_MS = 8000, DICTADO_ESPERA_MS = 12000;
let dcRec = null, dcCampo = '', dcUltimaVoz = 0, dcSilencio = null;
const dcAbierto = () => !!document.getElementById('capa-dictado');
function dictar(idCampo) {
    dcCampo = idCampo;
    const c = document.getElementById(idCampo), largo = c && c.tagName === 'TEXTAREA';
    const capa = document.createElement('div');
    capa.id = 'capa-dictado'; capa.className = 'fondo-modal'; capa.style.zIndex = 80;
    capa.onclick = ev => { if (ev.target === capa) cerrarDictado(); };
    capa.innerHTML = `<div class="modal"><div style="display:flex;align-items:center"><h3 style="flex:1;margin:0">🎤 Dictar</h3><button class="btn" style="flex:none;padding:8px 14px" onclick="cerrarDictado()">✕</button></div>
        <button id="dc-micro" class="dc-micro" onclick="alternarDictado()" ${esIOS() ? 'style="display:none"' : ''}>🎤</button>
        <div id="dc-estado" class="dc-estado"></div>
        <textarea id="dc-texto" rows="${largo ? 5 : 3}" placeholder="Lo que digas sale aquí (también se puede escribir)">${esc(c ? c.value : '')}</textarea>
        <div class="botones"><button class="btn pri" onclick="dictadoACampo()">Seguir ›</button></div></div>`;
    document.body.appendChild(capa);
    if ((window.SpeechRecognition || window.webkitSpeechRecognition) && !esIOS()) empezarDictado();
    else dictarConTeclado();
}
function dictarConTeclado() {
    const caja = document.getElementById('dc-texto'), est = document.getElementById('dc-estado');
    caja.focus(); est.style.color = '';
    est.textContent = esIOS() ? 'Toca el 🎤 del teclado (abajo) y habla. Si no sale: Ajustes › General › Teclado › Activar Dictado.'
        : 'Toca la casilla, usa el 🎤 del teclado y pulsa Seguir.';
}
function cerrarDictado() { pararDictado(); clearInterval(dcSilencio); document.getElementById('capa-dictado')?.remove(); }
function alternarDictado() { if (esIOS()) dictarConTeclado(); else if (dcRec) pararDictado(); else empezarDictado(); }
function pararDictado() { if (dcRec) { const r = dcRec; dcRec = null; r.stop(); } }
function empezarDictado(sigue) {
    const Reconocedor = window.SpeechRecognition || window.webkitSpeechRecognition;
    const caja = document.getElementById('dc-texto'), est = document.getElementById('dc-estado'), boton = document.getElementById('dc-micro');
    if (!caja) return;
    if (!sigue && Reconocedor) {
        dcUltimaVoz = Date.now(); clearInterval(dcSilencio);
        const habia = caja.value.trim();
        dcSilencio = setInterval(() => {
            if (!dcRec) { clearInterval(dcSilencio); return; }
            const dicho = caja.value.trim() !== habia;
            if (Date.now() - dcUltimaVoz > (dicho ? DICTADO_SILENCIO_MS : DICTADO_ESPERA_MS)) { clearInterval(dcSilencio); pararDictado(); }
        }, 300);
    }
    if (!Reconocedor) { dictarConTeclado(); return; }
    // Algunos Android repiten en cada trozo lo anterior ("buenas" + "buenas tardes"): si un trozo empieza por lo ya
    // juntado, lo sustituye en vez de añadirse
    const rec = new Reconocedor();
    rec.lang = 'es-ES'; rec.continuous = true; rec.interimResults = true;
    const inicio = caja.value ? caja.value.replace(/\s*$/, ' ') : '';
    let fallo = false, nuevo = false;
    rec.onresult = ev => {
        let frase = '';
        for (let i = 0; i < ev.results.length; i++) {
            const t = ev.results[i][0].transcript.trim();
            if (!t) continue;
            frase = frase && t.toLowerCase().startsWith(frase.toLowerCase()) ? t : (frase + ' ' + t).trim();
        }
        if (frase.trim()) { nuevo = true; dcUltimaVoz = Date.now(); }
        const todo = inicio + frase.trim();
        caja.value = todo.charAt(0).toUpperCase() + todo.slice(1);
    };
    rec.onerror = ev => {
        if (ev.error === 'no-speech' || ev.error === 'aborted') return;
        fallo = true;
        est.textContent = ev.error === 'not-allowed' ? 'Hay que dar permiso al micrófono.' : ev.error === 'audio-capture' ? 'El micrófono no responde: toca la casilla y usa el 🎤 del teclado.' : 'No se entendió (' + ev.error + '). Toca el micrófono y repite.';
    };
    rec.onend = () => {
        const aMano = dcRec !== rec;   // se paró tocando el micrófono, Seguir o la X (o tras el rato callado)
        dcRec = null;
        boton.classList.remove('escuchando');
        if (fallo) return;
        if (dcAbierto() && !aMano && !nuevo) {
            empezarDictado(true); est.textContent = caja.value.trim() ? 'Sigo escuchando... Cuando acabes, pulsa SEGUIR.' : 'Escuchando... habla ahora'; return;
        }
        if (!caja.value.trim()) { est.textContent = 'No he oído nada. Toca el micrófono y habla.'; return; }
        // El móvil corta en cuanto uno se para a pensar: se sigue escuchando y se añade a lo anterior hasta pulsar SEGUIR
        if (!dcAbierto()) return;
        if (nuevo && !aMano) { empezarDictado(true); est.textContent = 'Sigo escuchando... Cuando acabes, pulsa SEGUIR.'; }
        else est.textContent = 'Revisa el texto y pulsa SEGUIR. Para añadir más, toca el micrófono.';
    };
    dcRec = rec;
    boton.classList.add('escuchando');
    est.textContent = 'Escuchando... habla ahora';
    try { rec.start(); } catch (e) { dcRec = null; boton.classList.remove('escuchando'); est.textContent = 'No se pudo abrir el micrófono.'; }
}
function dictadoACampo() {
    const txt = document.getElementById('dc-texto').value.trim(), c = document.getElementById(dcCampo);
    cerrarDictado();
    if (c) { c.value = txt; c.dispatchEvent(new Event('input')); }
}

// ---------- 📢 ALTAVOZ (como el de 360): anuncios que salen al abrir la app y recordatorios de cada día ----------
// Lo ponen los adultos. Anuncio: sale una vez en cada móvil al abrir la app y se queda arriba en «Hoy» 1 día, 3 días…
// Recordatorio: cada día a su hora sale en la app (y arriba en «Hoy» hasta medianoche). Para que suene con la app
// cerrada, cada uno lo pasa a su Reloj o a su calendario con «⏰ Ponerme la alarma».
const anVistos = () => leerLS('af_anuncios_vistos', {});
const paraMi = a => !a.para || !cfg.yo || lista(a.para).includes(cfg.yo);
const anuncioVivo = a => a.tipo === 'recordatorio' ? (!a.hasta || a.hasta >= hoyIso()) : !!(a.caduca && new Date(a.caduca) > new Date());
const horaAhora = () => dos(new Date().getHours()) + ':' + dos(new Date().getMinutes());
const recordatorioYa = a => a.tipo === 'recordatorio' && (a.hora || '00:00') <= horaAhora();
function anunciosParaMi() { return D.anuncios.filter(a => anuncioVivo(a) && paraMi(a)); }
function tarjetasAnuncios() {
    const v = anunciosParaMi().filter(a => a.tipo !== 'recordatorio' || recordatorioYa(a));
    return v.map(a => `<div class="anuncio ${a.tipo === 'recordatorio' ? 'rec' : ''}" onclick="verAnuncio('${a.id}')"><div class="ico">${a.tipo === 'recordatorio' ? '⏰' : '📢'}</div>
        <div class="tx">${esc(a.texto.length > 200 ? a.texto.slice(0, 200) + '…' : a.texto)}<div class="sub">${anuncioSub(a)}</div></div></div>`).join('');
}
function anuncioSub(a) {
    const de = miembro(a.quien)?.nombre || '';
    if (a.tipo === 'recordatorio') return `Cada día a las ${a.hora}${a.hasta ? ' hasta el ' + deIso(a.hasta).getDate() + ' de ' + MESES[deIso(a.hasta).getMonth()] : ''}${de ? ' · ' + esc(de) : ''}`;
    const c = new Date(a.caduca);
    return `${de ? esc(de) + ' · ' : ''}hasta el ${c.getDate()} de ${MESES[c.getMonth()]}`;
}
// Sale solo: el anuncio, una vez en cada móvil (no a quien lo escribió); el recordatorio, una vez al día al llegar su hora
function mirarAnuncios() {
    if (document.querySelector('.fondo-modal')) return;
    const vistos = anVistos(), hoy = hoyIso();
    const a = anunciosParaMi().find(x => x.tipo === 'recordatorio' ? recordatorioYa(x) && vistos[x.id] !== hoy : !vistos[x.id] && (!cfg.yo || x.quien !== cfg.yo));
    if (!a) return;
    if (a.tipo === 'recordatorio' && navigator.vibrate) navigator.vibrate([300, 150, 300]);
    verAnuncio(a.id);
}
function verAnuncio(id) {
    const a = D.anuncios.find(x => x.id === id); if (!a) return;
    const vistos = anVistos(); vistos[a.id] = a.tipo === 'recordatorio' ? hoyIso() : '1';

    const rec = a.tipo === 'recordatorio';
    abrirModal(`<div style="text-align:center;font-size:46px">${rec ? '⏰' : '📢'}</div><h3 style="text-align:center">${rec ? 'Recordatorio' : 'Anuncio'}</h3>
        <div class="grande-aviso">${esc(a.texto)}</div><small class="ayuda">${anuncioSub(a)}</small>
        <div class="botones"><button class="btn pri" onclick="cerrarModal()">Entendido</button>${rec ? `<button class="btn" onclick="alarmaAnuncio('${a.id}')">⏰ Ponerme la alarma</button>` : ''}</div>
        ${esAdulto() ? `<div class="botones"><button class="btn" onclick="escribirAnuncio('${a.id}')">✏️ Corregir</button><button class="btn peligro" onclick="quitarAnuncio('${a.id}')">🗑️ Quitar</button></div>` : ''}`);
}

function escribirAnuncio(id, tipo) {
    const a = id ? D.anuncios.find(x => x.id === id) : { id: '', tipo, texto: '', para: '', hora: '20:00', hasta: '', caduca: '' };

        <textarea id="an-texto" maxlength="1000" placeholder="${rec ? 'Sacar al perro, tomar la medicina, preparar la mochila…' : 'Escribe el anuncio o pulsa 🎤 Dictar y dilo en voz alta'}">${esc(a.texto)}</textarea>
        <label class="et">Para quién</label>${chipsQuien(lista(a.para), true)}
        ${rec ? `<div class="dos"><div><label class="et">A qué hora</label><input type="time" id="an-hora" value="${a.hora || '20:00'}"></div>
            <div><label class="et">Hasta (si acaba)</label><input type="date" id="an-hasta" value="${a.hasta || ''}"></div></div>

        : `<label class="et">Se ve durante</label><select id="an-dias">${[[1, '1 día'], [3, '3 días'], [7, '1 semana'], [30, '1 mes']].map(([d, t]) => `<option value="${d}" ${d === dias ? 'selected' : ''}>${t}</option>`).join('')}</select>`}
        <small class="ayuda" id="an-estado"></small>
        <div class="botones"><button class="btn pri" style="background:${rec ? '#f57c00' : '#7c3aed'}" onclick="publicarAnuncio('${a.id}','${a.tipo}')">📢 Publicar</button>${id ? `<button class="btn peligro" onclick="quitarAnuncio('${a.id}')">🗑️ Quitar</button>` : ''}</div>
        <div class="botones"><button class="btn" onclick="abrirAltavoz()">‹ Volver</button></div>`);
}
function publicarAnuncio(id, tipo) {
    const texto = val('an-texto'), est = document.getElementById('an-estado');
    if (texto.replace(/[^\p{L}\p{N}]/gu, '').length < 3) { est.textContent = '✍️ Escribe o dicta primero qué hay que avisar.'; return; }
    const viejo = id ? D.anuncios.find(x => x.id === id) : null;
    // Si se corrige el texto, se le da otro id: así a todos les vuelve a salir
    const nuevoTexto = !viejo || viejo.texto !== texto;
    const a = { id: nuevoTexto ? nuevoId() : id, tipo, texto, quien: cfg.yo || '', para: quienElegido(), hora: '', hasta: '', caduca: '' };
    if (tipo === 'recordatorio') {
        a.hora = val('an-hora'); a.hasta = val('an-hasta');

    if (viejo && nuevoTexto) borrar('anuncios', viejo.id);

    // A quien lo escribe no le sale (el recordatorio de hoy sí, si su hora aún no ha llegado)
    const vistos = anVistos(); vistos[a.id] = tipo === 'recordatorio' ? (recordatorioYa(a) ? hoyIso() : '') : '1'; guardarLS('af_anuncios_vistos', vistos);
    cerrarModal();
    avisar(tipo === 'recordatorio' ? '⏰ Recordatorio puesto' : '📢 Anuncio publicado: lo verán al abrir la app');

}

// ---------- Aviso de versión nueva (como en 360): version.json junto a la app ----------
let versionMirada = 0;
async function mirarVersionNueva() {
    if (Date.now() - versionMirada < 10 * 60000 || !navigator.onLine || location.protocol === 'file:') return;
    versionMirada = Date.now();
    try {
        const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
        const nueva = Number((await r.json()).version) || 0;
        if (nueva > VERSION_APP) abrirModal(`<div style="text-align:center"><div style="font-size:54px">🔄</div><h3>Hay una versión nueva (v${nueva})</h3>
            <p style="color:var(--gris)">Tienes la v${VERSION_APP}. Toca Actualizar; si sigue igual, cierra la app del todo y vuelve a abrirla.</p>
            <div class="botones"><button class="btn pri" onclick="actualizarYa()">🔄 Actualizar</button><button class="btn" onclick="cerrarModal()">Luego</button></div></div>`);
    } catch (e) {}
}
async function actualizarYa() {
    try { const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch (e) {}
    location.reload();
}

// ---------- Arranque ----------
if (!miembro(cfg.yo)) cfg.yo = '';
if (miembro(cfg.yo)?.rol === 'hijo') filtro = cfg.yo;
// QR de instalación: el enlace lleva #hoja=<dirección del script> y la app queda apuntando a la hoja.
// La clave de la familia NO va en el QR: se escribe a mano. (El #… se deja en la dirección: en iPhone,
// la app de la pantalla de inicio guarda sus datos aparte de Safari y así también la recibe.)
(function () {
    const m = location.hash.match(/^#hoja=(https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec)$/);
    if (!m || cfg.url === m[1]) return;
    cfg.url = m[1]; guardarLS('af_config', cfg);
    if (!cfg.clave) setTimeout(() => { ir('ajustes'); avisar('🔑 Escribe la clave de la familia y pulsa «Guardar y conectar»'); }, 400);
})();
pintar();
sincronizar();
setTimeout(mirarVersionNueva, 3000);
setTimeout(mirarAnuncios, 800);
setTimeout(limpiarPapelera, 5000);
// Cada minuto, por si llega la hora de un recordatorio con la app abierta
setInterval(() => { if (document.visibilityState === 'visible') { mirarAnuncios(); if (vista === 'hoy' && !document.querySelector('.fondo-modal')) pintar(); } }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { sincronizar(); mirarVersionNueva(); pintar(); mirarAnuncios(); } });
setInterval(() => { if (document.visibilityState === 'visible' && !document.querySelector('.fondo-modal')) sincronizar(); }, 120000);
if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
    const habia = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (habia) location.reload(); });
}
</script>
